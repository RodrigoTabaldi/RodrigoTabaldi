<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Tabaldi — Software Engineer | Backend &amp; Full Stack</title>
  <desc id="description">A clean dark animated profile banner with readable text and subtle blue software network lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C13"/><stop offset=".62" stop-color="#0A111B"/><stop offset="1" stop-color="#101C2C"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="matrix(435 0 0 215 1000 154)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4B82" stop-opacity=".22"/><stop offset="1" stop-color="#1E4B82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="76" y1="0" x2="642" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76B1FF"/><stop offset=".66" stop-color="#4389E5" stop-opacity=".42"/><stop offset="1" stop-color="#4389E5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#A8BEDA" stroke-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#blueGlow)"/>
    <path d="M725 0H1200V320H725Z" fill="url(#grid)"/>

    <!-- Abstract network lines add motion without tiny labels or UI-like details. -->
    <g stroke="#6EA8F0" stroke-opacity=".24" stroke-width="1.5">
      <path d="M746 102H855L925 160H1036L1104 104H1180"/>
      <path d="M746 218H855L925 160H1036L1104 216H1180"/>
      <path d="M855 102V218M1036 104V216M1104 104V216"/>
    </g>
    <g fill="#0A1421" stroke="#8ABAF5" stroke-opacity=".58" stroke-width="1.5">
      <circle cx="746" cy="102" r="5"/><circle cx="855" cy="102" r="5"/>
      <circle cx="925" cy="160" r="5"/><circle cx="1036" cy="160" r="5"/>
      <circle cx="1104" cy="104" r="5"/><circle cx="1180" cy="104" r="5"/>
      <circle cx="746" cy="218" r="5"/><circle cx="855" cy="218" r="5"/>
      <circle cx="1104" cy="216" r="5"/><circle cx="1180" cy="216" r="5"/>
    </g>
    <g fill="#A7CEFF" filter="url(#softGlow)">
      <circle r="3"><animateMotion dur="9s" repeatCount="indefinite" path="M746 102H855L925 160H1036L1104 104H1180"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.1;.88;1" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="3"><animateMotion dur="10s" begin="-5s" repeatCount="indefinite" path="M1180 216H1104L1036 160H925L855 218H746"/><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.1;.88;1" dur="10s" begin="-5s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M76 69V258" stroke="#6DAAF8" stroke-opacity=".82" stroke-width="2"/>
    <text x="104" y="143" fill="#F5F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.8">Rodrigo Tabaldi</text>
    <text x="106" y="182" fill="#C2D0E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="550" letter-spacing=".15">Software Engineer  |  Backend &amp; Full-Stack Development</text>
    <rect x="106" y="204" width="560" height="1.5" fill="url(#accent)"/>
    <text x="106" y="237" fill="#B8C7D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="550" letter-spacing=".1">APIs  |  System Integration  |  Web Applications</text>
    <text x="106" y="264" fill="#B8C7D9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="550" letter-spacing=".1">Clear, Reliable &amp; Maintainable Software</text>
    <path d="M0 1H1200M0 319H1200" stroke="#A6BCD5" stroke-opacity=".12"/>
  </g>
</svg>
