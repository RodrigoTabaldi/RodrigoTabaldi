<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Tabaldi — Software Engineer, Backend Developer, .NET &amp; Full Stack</title>
  <desc id="description">A clean dark animated profile banner with readable text and subtle blue software network lines.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080C13"/><stop offset=".62" stop-color="#0A111B"/><stop offset="1" stop-color="#101C2C"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="matrix(435 0 0 215 1000 154)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4B82" stop-opacity=".22"/><stop offset="1" stop-color="#1E4B82" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="76" y1="0" x2="642" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76B1FF"/><stop offset=".66" stop-color="#4389E5" stop-opacity=".42"/><stop offset="1" stop-color="#4389E5" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#A8BEDA" stroke-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#blueGlow)"/>
    <path d="M725 0H1200V320H725Z" fill="url(#grid)"/>

    <!-- Quiet network details stay behind the type. -->
    <g stroke="#6EA8F0" stroke-opacity=".23" stroke-width="1.2">
      <path d="M776 78H882L931 120H1042L1092 83H1172"/>
      <path d="M800 247H900L956 201H1066L1120 247H1180"/>
      <path d="M882 78V155L900 173V247M1042 120V166L1066 183V201M1172 83V162L1180 177V247"/>
      <path d="M931 120L956 201" stroke-dasharray="2 7"/>
    </g>
    <g fill="#0A1421" stroke="#80B5F6" stroke-opacity=".48" stroke-width="1.3">
      <circle cx="776" cy="78" r="4"/><circle cx="882" cy="78" r="4"/>
      <circle cx="931" cy="120" r="4"/><circle cx="1042" cy="120" r="4"/>
      <circle cx="1092" cy="83" r="4"/><circle cx="1172" cy="83" r="4"/>
      <circle cx="800" cy="247" r="4"/><circle cx="900" cy="247" r="4"/>
      <circle cx="956" cy="201" r="4"/><circle cx="1066" cy="201" r="4"/>
      <circle cx="1120" cy="247" r="4"/><circle cx="1180" cy="247" r="4"/>
    </g>
    <g fill="#9CCAFF" filter="url(#softGlow)">
      <circle r="2.4"><animateMotion dur="9s" repeatCount="indefinite" path="M776 78H882L931 120H1042L1092 83H1172"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.1;.88;1" dur="9s" repeatCount="indefinite"/></circle>
      <circle r="2.2"><animateMotion dur="10s" begin="-5s" repeatCount="indefinite" path="M1180 247H1120L1066 201H956L900 247H800"/><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.1;.88;1" dur="10s" begin="-5s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#9CCAFF">
      <circle cx="931" cy="120" r="2.5"><animate attributeName="opacity" values=".3;.85;.3" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="1066" cy="201" r="2.5"><animate attributeName="opacity" values=".8;.28;.8" dur="5.5s" repeatCount="indefinite"/></circle>
      <circle cx="1172" cy="83" r="2"><animate attributeName="opacity" values=".25;.8;.25" dur="4s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M76 69V258" stroke="#6DAAF8" stroke-opacity=".76" stroke-width="2"/>
    <text x="104" y="143" fill="#F5F7FB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="50" font-weight="650" letter-spacing="-1.8">Rodrigo Tabaldi</text>
    <text x="106" y="181" fill="#B6C4D5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing=".15">Software Engineer  |  Backend Developer  |  .NET &amp; Full Stack</text>
    <rect x="106" y="203" width="544" height="1.2" fill="url(#accent)"/>
    <text x="106" y="235" fill="#A6B5C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing=".2">C#  ·  .NET  ·  ASP.NET Core  ·  Python  ·  React  ·  TypeScript</text>
    <text x="106" y="261" fill="#A6B5C8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" letter-spacing=".2">PostgreSQL  ·  Docker  ·  Git</text>
    <path d="M0 1H1200M0 319H1200" stroke="#A6BCD5" stroke-opacity=".12"/>
  </g>
</svg>
