<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Tabaldi — Software Engineering Student and Backend Developer</title>
  <desc id="description">Animated dark professional banner with a subtle network diagram and software technologies.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D14"/>
      <stop offset="1" stop-color="#101927"/>
    </linearGradient>
    <linearGradient id="accent" x1="690" y1="70" x2="1190" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA" stop-opacity=".08"/>
      <stop offset=".55" stop-color="#60A5FA" stop-opacity=".48"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity=".15"/>
    </linearGradient>
    <linearGradient id="rule" x1="80" y1="0" x2="570" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientTransform="matrix(465 0 0 205 966 148)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1280" height="320" fill="url(#background)"/>
    <rect width="1280" height="320" fill="url(#ambient)"/>
    <rect x="682" y="0" width="598" height="320" fill="url(#grid)" opacity=".7"/>

    <!-- Quiet network diagram in the right half keeps the copy clear. -->
    <g stroke="url(#accent)" stroke-width="1.25">
      <path d="M742 85H840L900 135H1003L1060 88H1178"/>
      <path d="M793 230H886L946 184H1050L1110 235H1210"/>
      <path d="M840 85V142L886 184V230"/>
      <path d="M1003 135V184"/>
      <path d="M1060 88V145L1050 184"/>
      <path d="M1178 88V164L1210 192V235"/>
      <path d="M742 85V160L793 210V230"/>
      <path d="M900 135L946 184" stroke-dasharray="3 7"/>
    </g>
    <g fill="#0D1726" stroke="#60A5FA" stroke-opacity=".68" stroke-width="1.4">
      <rect x="733" y="76" width="18" height="18" rx="5"/>
      <rect x="831" y="76" width="18" height="18" rx="5"/>
      <circle cx="900" cy="135" r="5"/><rect x="994" y="126" width="18" height="18" rx="5"/>
      <circle cx="1060" cy="88" r="5"/><circle cx="1178" cy="88" r="5"/>
      <circle cx="793" cy="230" r="5"/><rect x="878" y="221" width="18" height="18" rx="5"/>
      <circle cx="946" cy="184" r="5"/><circle cx="1050" cy="184" r="5"/>
      <rect x="1101" y="226" width="18" height="18" rx="5"/><circle cx="1210" cy="235" r="5"/>
    </g>
    <g fill="#93C5FD" filter="url(#glow)">
      <circle r="2.6">
        <animateMotion dur="8s" repeatCount="indefinite" path="M742 85H840L900 135H1003L1060 88H1178"/>
        <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.08;.82;1" dur="8s" repeatCount="indefinite"/>
      </circle>
      <circle r="2.4">
        <animateMotion dur="10s" begin="-4s" repeatCount="indefinite" path="M1210 235H1110L1050 184H946L886 230H793"/>
        <animate attributeName="opacity" values="0;.8;.8;0" keyTimes="0;.08;.82;1" dur="10s" begin="-4s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#93C5FD">
      <circle cx="900" cy="135" r="3"><animate attributeName="opacity" values=".35;.9;.35" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="184" r="3"><animate attributeName="opacity" values=".8;.3;.8" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1178" cy="88" r="2.5"><animate attributeName="opacity" values=".25;.85;.25" dur="4.6s" repeatCount="indefinite"/></circle>
    </g>
    <path d="M80 65V255" stroke="#60A5FA" stroke-opacity=".62" stroke-width="2"/>
    <text x="104" y="135" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="47" font-weight="650" letter-spacing="-1.7">Rodrigo Tabaldi</text>
    <text x="105" y="174" fill="#AFC0D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="450" letter-spacing=".2">Software Engineering Student  |  Backend Developer  |  .NET &amp; Full Stack</text>
    <rect x="105" y="196" width="450" height="1" fill="url(#rule)"/>
    <text x="105" y="226" fill="#8294AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing=".25">C#  ·  .NET  ·  ASP.NET Core  ·  Python  ·  React  ·  TypeScript</text>
    <text x="105" y="250" fill="#8294AA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" letter-spacing=".25">PostgreSQL  ·  Docker  ·  Git</text>
    <path d="M0 1H1280" stroke="#94A3B8" stroke-opacity=".13"/>
    <path d="M0 319H1280" stroke="#94A3B8" stroke-opacity=".13"/>
  </g>
</svg>
