<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Rodrigo Tabaldi | Software Engineer | Backend, Full Stack, .NET</title>
  <desc id="description">A refined dark animated profile banner with a quiet software architecture diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D16"/><stop offset=".58" stop-color="#0B1320"/><stop offset="1" stop-color="#101D2D"/>
    </linearGradient>
    <linearGradient id="edge" x1="735" y1="58" x2="1200" y2="274" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B9BFA" stop-opacity=".05"/><stop offset=".5" stop-color="#77B5FF" stop-opacity=".52"/><stop offset="1" stop-color="#5B9BFA" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="line" x1="78" y1="0" x2="617" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#74B2FF"/><stop offset=".74" stop-color="#4688EA" stop-opacity=".32"/><stop offset="1" stop-color="#4688EA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientTransform="matrix(430 0 0 220 1034 158)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2763B9" stop-opacity=".16"/><stop offset="1" stop-color="#2763B9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#9BB7D6" stroke-opacity=".045"/>
    </pattern>
    <filter id="softGlow" x="-400%" y="-400%" width="900%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="320" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#haze)"/>
    <path d="M690 0H1280V320H690Z" fill="url(#grid)"/>

    <!-- Subtle architecture flow: API to services to persistent data. -->
    <g stroke="url(#edge)" stroke-width="1.4">
      <path d="M786 132H876M1024 132H1100"/>
      <path d="M950 92V63H1139V92M950 172V205H1139V172"/>
      <path d="M1174 132H1210V226H1174" stroke-dasharray="3 7"/>
    </g>
    <g fill="#0C1726" stroke="#75ADFA" stroke-opacity=".46">
      <rect x="744" y="104" width="142" height="56" rx="10"/>
      <rect x="921" y="104" width="142" height="56" rx="10"/>
      <rect x="1098" y="104" width="142" height="56" rx="10"/>
    </g>
    <g fill="#8DBEFF">
      <circle cx="769" cy="132" r="4"/><circle cx="946" cy="132" r="4"/><circle cx="1123" cy="132" r="4"/>
    </g>
    <g fill="#E4EDF8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.05">
      <text x="782" y="137">API</text>
      <text x="959" y="137">SERVICES</text>
      <text x="1136" y="137">DATA</text>
    </g>
    <g fill="#8EA4BE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="500" letter-spacing="1.45">
      <text x="744" y="91">APPLICATION LAYER</text>
      <text x="1098" y="91">PERSISTENCE</text>
      <text x="924" y="226">CLEAR BOUNDARIES · RELIABLE SYSTEMS</text>
    </g>
    <g fill="#84B9FF" filter="url(#softGlow)">
      <circle r="2.7"><animateMotion dur="5s" repeatCount="indefinite" path="M786 132H876"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.1;.86;1" dur="5s" repeatCount="indefinite"/></circle>
      <circle r="2.7"><animateMotion dur="5s" begin="-2.5s" repeatCount="indefinite" path="M1024 132H1100"/><animate attributeName="opacity" values="0;.85;.85;0" keyTimes="0;.1;.86;1" dur="5s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <circle r="2.5"><animateMotion dur="6s" begin="-3s" repeatCount="indefinite" path="M1100 132H1024"/><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.1;.86;1" dur="6s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle r="2.5"><animateMotion dur="6s" begin="-1s" repeatCount="indefinite" path="M876 132H786"/><animate attributeName="opacity" values="0;.75;.75;0" keyTimes="0;.1;.86;1" dur="6s" begin="-1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#87B8F6">
      <circle cx="950" cy="63" r="2"><animate attributeName="opacity" values=".2;.8;.2" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1139" cy="205" r="2"><animate attributeName="opacity" values=".8;.25;.8" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1210" cy="226" r="2"><animate attributeName="opacity" values=".25;.7;.25" dur="4.5s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M78 72V250" stroke="#69A8FA" stroke-opacity=".72" stroke-width="2"/>
    <text x="105" y="132" fill="#F3F7FC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="49" font-weight="650" letter-spacing="-1.8">Rodrigo Tabaldi</text>
    <text x="107" y="170" fill="#A9B9CD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" letter-spacing=".2">Software Engineer  ·  Backend &amp; Full Stack  ·  .NET</text>
    <rect x="107" y="193" width="500" height="1" fill="url(#line)"/>
    <text x="107" y="224" fill="#98A9BE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500" letter-spacing=".22">C#  ·  .NET  ·  ASP.NET Core  ·  PostgreSQL</text>
    <text x="107" y="247" fill="#71859E" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="450" letter-spacing=".2">Python  ·  React  ·  TypeScript  ·  Docker  ·  Git</text>
    <path d="M0 1H1280M0 319H1280" stroke="#A6BCD5" stroke-opacity=".11"/>
  </g>
</svg>
